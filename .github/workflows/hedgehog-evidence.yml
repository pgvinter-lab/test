name: Hedgehog evidence gate

on:
  push:
    branches:
      - hedgehog/agy-continuous
    paths:
      - "hedgehog/**"
      - ".github/workflows/hedgehog-evidence.yml"
  pull_request:
    paths:
      - "hedgehog/**"
      - ".github/workflows/hedgehog-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse Hedgehog PowerShell orchestration
        shell: pwsh
        run: |
          $files = @(
            "hedgehog/scripts/run_agy_loop.ps1",
            "hedgehog/scripts/install_agy_task.ps1",
            "hedgehog/scripts/bootstrap_runner_python.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file: $($_.Message)" }
              exit 1
            }
          }
      - name: Verify evidence manifests and queue claims
        run: python hedgehog/scripts/verify_evidence.py
      - name: Run Hedgehog verifier unit tests
        run: python -m unittest discover -s hedgehog/tests -p "test_*.py"
