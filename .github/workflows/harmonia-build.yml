name: Build Harmonia APK
on:
  push:
    branches: [ harmonia-apk-build-20260803 ]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Build installable debug APK
        run: gradle --no-daemon clean :app:assembleDebug
      - name: Verify APK and signature
        run: |
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk | tee apk-verification.txt
          cp app/build/outputs/apk/debug/app-debug.apk Harmonia-1.0.0.apk
          sha256sum Harmonia-1.0.0.apk | tee Harmonia-1.0.0.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Harmonia-1.0.0-APK
          path: |
            Harmonia-1.0.0.apk
            Harmonia-1.0.0.apk.sha256
            apk-verification.txt
